name: raad_workspace
publish_to: none
environment:
  sdk: ^3.6.0
workspace:
  - app/driver_app
  - app/parent_app
  - app/raad_core
dev_dependencies:
  melos: ^7.0.0
melos:
  scripts:
    analyze: melos exec -- flutter analyze
    test: melos exec --dir-exists=test -- flutter test
    gen: melos exec --depends-on=build_runner -- dart run build_runner build -d
