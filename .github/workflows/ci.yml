name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: API, admin and shared package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep the in-memory MongoDB binary outside node_modules so it can be cached.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache the MongoDB test binary
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check generated design tokens are up to date
        run: |
          npm run tokens
          git diff --exit-code || {
            echo "::error::Generated design files are out of date. Run 'npm run tokens' and commit the result."
            exit 1
          }

      - name: Lint, typecheck, test and build
        run: npx turbo run lint typecheck test build

  flutter:
    name: Flutter apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install
        run: flutter pub get

      - name: Analyze
        run: flutter analyze app

      - name: Test
        run: |
          for package in driver_app parent_app raad_core; do
            echo "::group::flutter test $package"
            (cd "app/$package" && flutter test)
            echo "::endgroup::"
          done
